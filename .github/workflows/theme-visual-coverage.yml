name: Theme visual coverage

on:
  pull_request:
    branches: [integration/base16-theme-system]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:theme-colors:scan
      - run: pnpm audit:theme-colors:export-runtime-worklist
      - run: pnpm audit:theme-visuals:capture
      - run: pnpm audit:theme-visuals:check
      - uses: actions/upload-artifact@v4
        with:
          name: theme-visual-coverage-${{ github.sha }}
          path: .artifacts/theme-visual-coverage
          if-no-files-found: error
          retention-days: 30
